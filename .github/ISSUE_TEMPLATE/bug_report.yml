name: Bug report
description: Report a reproducible problem in SignalForge
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SignalForge. Search existing issues first and never include credentials, private source material, or vulnerability details. Use the private security process in `SECURITY.md` for exploitable issues.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction you can.
      placeholder: |
        1. Start...
        2. Submit...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web interface
        - API
        - Worker or queue
        - Web extraction
        - LLM processing
        - Record processing
        - Database
        - Observability or operations
        - Documentation
        - Unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA, branch, or release

  - type: input
    id: environment
    attributes:
      label: Environment
      description:
        Include OS, Node version, pnpm version, and Docker version when
        relevant.
      placeholder: Windows 11, Node 24.13, pnpm 10.12.1

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description:
        Remove secrets, tokens, connection URLs, personal data, and source
        content.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label:
            I removed credentials, private data, and sensitive source content.
          required: true
        - label:
            This is not a vulnerability report requiring private disclosure.
          required: true

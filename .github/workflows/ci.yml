name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://signalforge:signalforge_ci@localhost:5432/signalforge_test
      TEST_DATABASE_URL: postgresql://signalforge:signalforge_ci@localhost:5432/signalforge_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalforge
          POSTGRES_PASSWORD: signalforge_ci
          POSTGRES_DB: signalforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalforge -d signalforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Apply test database migrations
        run: pnpm db:migrate:test

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t signalforge-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t signalforge-worker:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t signalforge-web:ci .

      - name: Validate Docker Compose
        run: docker compose config --quiet

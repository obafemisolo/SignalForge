name: Feature proposal
description: Propose an improvement to SignalForge
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. SignalForge prioritizes explicit sources, evidence attribution, bounded work, and safe runtime boundaries.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What contributor or user problem should this solve?
      placeholder: Describe the need without prescribing an implementation yet.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible, easier, or safer?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Web interface
        - API
        - Worker or queue
        - Web extraction
        - LLM processing
        - Record processing
        - Database
        - Observability or operations
        - Documentation or contributor experience
        - Cross-cutting or unsure
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: Optional implementation ideas, alternatives, or examples.

  - type: textarea
    id: safety
    attributes:
      label: Security, privacy, and source impact
      description:
        Does this change fetched sources, data retention, prompts, evidence,
        credentials, authentication, or public exposure?
      placeholder: Describe the impact or write "None identified."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: What should deliberately remain out of scope?

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label:
            This proposal preserves the project's ethical web-extraction policy,
            or clearly identifies the boundary that needs discussion.
          required: true
